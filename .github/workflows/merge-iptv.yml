name: Merge M3U Playlists

on:
  push:
    paths:
      - 'ARABIC'
      - 'MySAT'
      - 'ROTANA'
      - 'SHAHID'
      - 'SHASHA'
      - 'STCtv'
      - 'StarzPlay'
      - 'WORLD'
      - 'VOD'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ⚠️ ضروري للسماح بعملية push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Merge playlists
        run: |
          echo "#EXTM3U" > all.m3u
          for file in ARABIC MySAT ROTANA SHAHID SHASHA STCtv StarzPlay WORLD VOD; do
            if [ -f "$file" ]; then
              echo "" >> all.m3u
              # استبعاد سطر #EXTM3U الأصلي وإضافة بقية المحتوى
              grep -v "^#EXTM3U" "$file" >> all.m3u || true
            fi
          done
          echo "✅ Merged file created:"
          wc -l all.m3u

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-merge playlists"
          git push