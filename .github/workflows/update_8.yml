name: Update M3U Token

on:
  workflow_dispatch:

  push:
    paths:
      - 'token.txt'

jobs:
  update-token:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 تحميل الكود من المستودع
        uses: actions/checkout@v4

      - name: 🐍 إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ تشغيل سكربت التحديث
        run: python update_THMANYAH.py

      - name: 💾 حفظ التغييرات ورفعها
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add THMANYAH 811FHD.m3u 812FHD.m3u 813FHD.m3u 811SDR4k.m3u 812SDR4k.m3u 813SDR4k.m3u 811.m3u 812.m3u 813.m3u 814.m3u 815.m3u 816.m3u
          if git diff --staged --quiet; then
            echo "لا توجد تغييرات للرفع"
          else
            git commit -m "🤖 تحديث التوكن تلقائياً في القوائم"
            git push
          fi
